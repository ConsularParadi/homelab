networks:
  proxy:
    external: true
services:
  paisa:
    restart: unless-stopped
    networks:
      - proxy
    container_name: paisa
    image: ananthakumaran/paisa:latest
    ports:
      - ${PAISA_PORT}:7500
    volumes:
      - "${CONFIG_DIR}/paisa:/root/Documents/paisa"
    labels:
      homepage.group: Apps
      homepage.name: Paisa
      homepage.icon: paisa.png
      homepage.href: "http://${IP_ADDR}:${PAISA_PORT}"
      homepage.description: "Personal Finance Manager"
  paperless-redis:
    restart: unless-stopped
    networks:
      - proxy
    image: docker.io/library/redis:8
    container_name: paperless-redis
    volumes:
      - "${CONFIG_DIR}/paperless/redis:/data"
  paperless:
    restart: unless-stopped
    networks:
      - proxy
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless-ngx
    depends_on:
      - paperless-redis
    ports:
      - "${PAPERLESS_PORT}:8000"
    volumes:
      - "${MEDIA_DIR}/docs:/usr/src/paperless/media"
      - "${CONFIG_DIR}/paperless:/usr/src/paperless/data"
      - "${CONFIG_DIR}/paperless/export:/usr/src/paperless/export"
      - "${CONFIG_DIR}/paperless/consume:/usr/src/paperless/consume"
    environment:
      PAPERLESS_REDIS: redis://paperless-redis:6379
    labels:
      homepage.group: Apps
      homepage.name: Paperless-NGX
      homepage.icon: paperless-ngx.png
      homepage.href: "http://${IP_ADDR}:${PAPERLESS_PORT}"
      homepage.description: "Document Management System"
  quartz:
    restart: unless-stopped
    networks:
      - proxy
    image: 192.168.1.52:31005/consular/quartz
    container_name: quartz
    ports:
      - "${QUARTZ_PORT}:8080"
      - "${QUARTZ_PORT_3001}:3001"
    volumes:
      - ${MEDIA_DIR}/notes:/usr/src/app/content
    labels:
      homepage.group: Apps
      homepage.name: Quartz
      homepage.icon: quartz.png
      homepage.href: "http://${IP_ADDR}:${QUARTZ_PORT_8080}"
      homepage.description: "Digital Garden"
  vikunja:
    restart: unless-stopped
    networks:
      - proxy
    image: vikunja/vikunja
    container_name: vikunja
    ports:
      - ${VIKUNJA_PORT}:3456
    volumes:
      - "${CONFIG_DIR}/vikunja/files:/app/vikunja/files"
    environment:
      VIKUNJA_DATABASE_HOST: vikunja-db
      VIKUNJA_DATABASE_PASSWORD: ${VIKUNJA_DB_PASSWORD}
      VIKUNJA_DATABASE_TYPE: mysql
      VIKUNJA_DATABASE_USER: vikunja
      VIKUNJA_DATABASE_DATABASE: vikunja
      VIKUNJA_SERVICE_JWTSECRET: ${VIKUNJA_JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    labels:
      homepage.group: Apps
      homepage.name: Vikunja
      homepage.icon: vikunja.png
      homepage.href: "http://${IP_ADDR}:${VIKUNJA_PORT}"
      homepage.description: "To-do List Application"
  db:
    restart: unless-stopped
    networks:
      - proxy
    image: mariadb:10
    container_name: vikunja-db
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - "${CONFIG_DIR}/vikunja/db:/var/lib/mysql"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: vikunja
      MYSQL_PASSWORD: ${VIKUNJA_DB_PASSWORD}
      MYSQL_DATABASE: vikunja
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u $MYSQL_USER --password=$MYSQL_PASSWORD"]
      interval: 2s
      start_period: 30s
