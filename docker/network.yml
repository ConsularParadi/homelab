services:
  traefik:
    image: "traefik:v3.4"
    container_name: "traefik"
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - "80:80"
      #- "443:443"
      - "31002:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "${CONFIG_DIR}/traefik/traefik.yml:/etc/traefik/traefik.yml:ro"
      #- "${CONFIG_DIR}/traefik/acme.json:/etc/traefik/acme.json"
    networks:
      - proxy
    restart: unless-stopped
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    ports:
      # DNS Ports
      - "53:53/tcp"
      - "53:53/udp"
      - "31001:80/tcp" # Default HTTP Port
      #- "443:443/tcp" # Default HTTPs Port. FTL will generate a self-signed certificate
      #- "67:67/udp" # Uncomment the below if using Pi-hole as your DHCP Server
      #- "123:123/udp" # Uncomment the line below if you are using Pi-hole as your NTP server
    environment:
      TZ: 'Asia/Kolkata'
      FTLCONF_webserver_api_password: 'correct horse battery staple' # Set a password to access the web interface. Not setting one will result in a random password being assigned
      FTLCONF_dns_listeningMode: 'all' # If using Docker's default `bridge` network setting the dns listening mode should be set to 'all'
    volumes:
      - '${CONFIG_DIR}/pihole:/etc/pihole'
      # Uncomment the below if you have custom dnsmasq config files that you want to persist. Not needed for most starting fresh with Pi-hole v6. If you're upgrading from v5 you and have used this directory before, you should keep it enabled for the first v6 container start to allow for a complete migration. It can be removed afterwards. Needs environment variable FTLCONF_misc_etc_dnsmasq_d: 'true'
      #- './etc-dnsmasq.d:/etc/dnsmasq.d'
    cap_add:
      - NET_ADMIN # Required if you are using Pi-hole as your DHCP server, else not needed
      #- SYS_TIME # Required if you are using Pi-hole as your NTP client to be able to set the host's system time
      - SYS_NICE # Optional, if Pi-hole should get some more processing time
    restart: unless-stopped
