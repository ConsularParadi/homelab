services:
  dind:
    image: docker:28.3.3-dind@sha256:c0872aae4791ff427e6eda52769afa04f17b5cf756f8267e0d52774c99d5c9de
    container_name: forgejo-dind
    privileged: true
    restart: unless-stopped
    command: ["dockerd", "-H", "tcp://0.0.0.0:2375", "--tls=false"]
  runner:
    image: code.forgejo.org/forgejo/runner:9.0.3@sha256:9ae7e65c14e7d49549432cbbbb2ed95e5e04ede234feb28bfd70a2dc04385263
    links:
      - dind
    depends_on:
      dind:
        condition: service_started
    container_name: forgejo-runner
    user: 1000:1000
    environment:
      DOCKER_HOST: tcp://dind:2375
    volumes:
      - ${CONFIG_DIR}/forgejo/runner/data:/data
      - ${CONFIG_DIR}/forgejo/runner/config.yml:/config.yaml
    restart: unless-stopped
    command: '/bin/sh -c "while : ; do sleep 1 ; done ;"'
  git:
    image: codeberg.org/forgejo/forgejo:12
    container_name: forgejo
    environment:
      - USER_UID=1000
      - USER_GID=1000
    restart: always
    networks:
      - proxy
    volumes:
      - ${CONFIG_DIR}/forgejo:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - '${GIT_PORT}:3000'
      - '${GIT_SSH_PORT}:22'
    labels:
      homepage.group: Meta
      homepage.name: Forgejo
      homepage.icon: forgejo.png
      homepage.href: "http://${IP_ADDR}:${GIT_PORT}"
      homepage.description: "Self hosted Git"
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${CONFIG_DIR}/portainer:/data
    networks:
      - proxy
    ports:
      - ${PORTAINER_PORT}:9000
    labels:
      homepage.group: Meta
      homepage.name: Portainer
      homepage.icon: portainer.png
      homepage.href: "http://${IP_ADDR}:${PORTAINER_PORT}"
      homepage.description: "Container Management"
  #      - "traefik.enable=true"
  #      - "traefik.http.routers.portainer.rule=Host(`portainer.home.arpa`)"
  #      - "traefik.http.routers.portainer.entrypoints=web"
  #      - "traefik.http.services.portainer.loadbalancer.server.port=9000"

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    networks:
      - proxy
    ports:
      - ${HOMEPAGE_PORT}:3000
    volumes:
      - ${CONFIG_DIR}/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      HOMEPAGE_ALLOWED_HOSTS: "*" #gethomepage.dev # required, may need port. See gethomepage.dev/installation/#homepage_allowed_hosts
  guacamole:
    image: oznu/guacamole
    container_name: guacamole
    volumes:
      - ${CONFIG_DIR}/guacamole:/config
    ports:
      - ${GUACAMOLE_PORT}:8080
    labels:
      homepage.group: Meta
      homepage.name: Guacamole
      homepage.icon: guacamole.png
      homepage.href: "http://${IP_ADDR}:${GUACAMOLE_PORT}"
      homepage.description: "Access to server UI"
networks:
  proxy:
    name: proxy
    driver: bridge
