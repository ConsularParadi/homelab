networks:
  proxy:
    external: true
services:
  homepage:
    restart: unless-stopped
    networks:
      - proxy
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    ports:
      - ${HOMEPAGE_PORT}:3000
    volumes:
      - ${CONFIG_DIR}/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      HOMEPAGE_ALLOWED_HOSTS: "*"
  rustdesk:
    image: lscr.io/linuxserver/rustdesk:latest
    container_name: rustdesk
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_DIR}/rustdesk:/config
    ports:
      #- 3000:3000
      - ${RUSTDESK_PORT}:3001
    networks:
      - proxy
    shm_size: "1gb"
    restart: unless-stopped
    labels:
      homepage.group: Meta
      homepage.name: Rustdesk
      homepage.icon: rustdesk.png
      homepage.href: "http://${IP_ADDR}:${RUSTDESK_PORT}"
      homepage.description: "Access to server UI"
