services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
    volumes:
      - ${CONFIG_DIR}/jellyfin:/config
      - ${MEDIA_DIR}/tv-shows:/data/tvshows
      - ${MEDIA_DIR}/movies:/data/movies
    ports:
      - ${JELLYFIN_PORT}:8096
    #      - 8920:8920 #optional
    #      - 7359:7359/udp #optional
    #      - 1900:1900/udp #optional
    networks:
      - proxy
    labels:
      homepage.group: Media
      homepage.name: Jellyfin
      homepage.icon: jellyfin.png
      homepage.href: "http://${IP_ADDR}:${JELLYFIN_PORT}"
      homepage.description: "Media Server"
  navidrome:
    container_name: navidrome
    image: deluan/navidrome:latest
    environment:
      ND_SCANSCHEDULE: 1h
      ND_LOGLEVEL: info
      ND_SESSIONTIMEOUT: 24h
      ND_BASEURL: ""
    volumes:
      - ${CONFIG_DIR}/navidrome:/data
      - ${MEDIA_DIR}/music:/music:ro
    ports:
      - "${MUSIC_PORT}:4533"
    networks:
      - proxy
    user: 1000:1000
    restart: unless-stopped
    labels:
      homepage.group: Media
      homepage.name: Navidrome
      homepage.icon: navidrome.png
      homepage.href: "http://${IP_ADDR}:${MUSIC_PORT}"
      homepage.description: "Music Server"
