services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    ports:
      - 31107:6767
    volumes:
      - ${CONFIG_DIR}/bazarr:/config
      - ${MEDIA_DIR}/movies:/movies
      - ${MEDIA_DIR}/tv-shows:/tv
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
    restart: unless-stopped
    networks:
      - proxy
  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    volumes:
      - ${CONFIG_DIR}/jackett:/config
      - ${MEDIA_DIR}/downloads/torrents:/downloads
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
      - AUTO_UPDATE=true
    network_mode: service:gluetun
  jellyseerr:
    image: docker.io/fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    ports:
      - 31101:5055
    volumes:
      - ${CONFIG_DIR}/jellyseerr:/app/config
    environment:
      - LOG_LEVEL=debug
      - TZ=Asia/Kolkata
    restart: unless-stopped
    networks:
      - proxy
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    ports:
      - 31105:7878
    volumes:
      - ${CONFIG_DIR}/radarr:/config
      - ${MEDIA_DIR}:/media
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
    restart: unless-stopped
    networks:
      - proxy
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    ports:
      - 31106:8989
    volumes:
      - ${CONFIG_DIR}/sonarr:/config
      - ${MEDIA_DIR}:/media
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
    restart: unless-stopped
    networks:
      - proxy
  fileflows:
    image: revenz/fileflows
    restart: unless-stopped
    runtime: nvidia
    ports:
      - "31110:5000"
    environment:
      - TempPathHost=/mnt/nas/config/config/tdarr/temp
      - TZ=Asia/Kolkata
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ${CONFIG_DIR}/fileflows/logs:/app/logs
      - ${CONFIG_DIR}/fileflows/temp:/temp
      - ${CONFIG_DIR}/fileflows/common:/app/common
      - ${MEDIA_DIR}:/app/Data
      - /var/run/docker.sock:/var/run/docker.sock:ro
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    ports:
      - 31108:8080
      - 6881:6881
      - 6881:6881/udp
    volumes:
      - ${CONFIG_DIR}/qbittorrent:/config
      - ${MEDIA_DIR}/downloads/torrents:/downloads
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    restart: unless-stopped
    networks:
      - proxy
