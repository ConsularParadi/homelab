name: Docker CI/CD
on:
  push:
    branches:
      - main
    paths:
      - 'docker/**'
jobs:
  deploy-docker-stack:
    runs-on: docker
    container:
      image: node:20-alpine
      options: --privileged
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock # Mount the host's Docker socket
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Pull and deploy new Docker stack
        run: |
          # The Docker CLI needs to be installed in the Node.js image
          apk add --no-cache docker-cli docker-compose

          cd docker
          docker compose $(printf " -f %s" *.yml) up -d
